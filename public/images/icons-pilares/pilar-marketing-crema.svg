<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="empentIA pilar · Marketing IA"><style>
  .nv-halo,.sonar,.fl,.bar{transform-box:fill-box;transform-origin:center}
  .nv-halo{animation:halo 2.4s infinite ease-out}
  @keyframes halo{0%{transform:scale(.7);opacity:.75}80%,100%{transform:scale(2.3);opacity:0}}
  .sonar{animation:sonar 2s infinite ease-out}.sonar.s2{animation-delay:.6s}
  @keyframes sonar{0%{transform:scale(.5);opacity:.85}100%{transform:scale(1.3);opacity:0}}
  .ln{stroke-dasharray:13;animation:draw 2.4s infinite}.ln.l2{animation-delay:.3s}.ln.l3{animation-delay:.6s}
  @keyframes draw{0%{stroke-dashoffset:13;opacity:.3}30%{stroke-dashoffset:0;opacity:1}80%{opacity:1}100%{stroke-dashoffset:0;opacity:.3}}
  .fl{animation:flow 1.8s infinite}.fl.f2{animation-delay:.3s}.fl.f3{animation-delay:.6s}
  @keyframes flow{0%,100%{opacity:.2;transform:scale(.55)}45%{opacity:1;transform:scale(1)}}
  .bar{transform-origin:bottom;animation:grow 2.2s infinite ease-in-out}
  .bar.b2{animation-delay:.18s}.bar.b3{animation-delay:.36s}.bar.b4{animation-delay:.54s}
  @keyframes grow{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
  .bl{animation:blink 1.8s infinite}.bl.k2{animation-delay:.45s}.bl.k3{animation-delay:.9s}
  @keyframes blink{0%,100%{opacity:.32}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.ln{stroke-dashoffset:0}.bar{transform:scaleY(1)}.fl,.sonar{opacity:.6}}
</style><rect x="0.9" y="0.9" width="94.2" height="94.2" rx="21" fill="#FAFAF7" stroke="#161616" stroke-width="1.4"/><g transform="translate(48,48) scale(2.3) translate(-12,-12)"><path d="M4 11 13 7.5V16.5L4 13z" fill="none" stroke="#161616" stroke-width="1.9" stroke-linejoin="round"/><path d="M6.6 14v3a1.5 1.5 0 0 0 1.5 1.5h.8" fill="none" stroke="#161616" stroke-width="1.9" stroke-linecap="round"/><path class="sonar" d="M14.6 9.6a4 4 0 0 1 0 4.8" fill="none" stroke="#00996c" stroke-width="1.6" stroke-linecap="round"/><path class="sonar s2" d="M16.8 8a6 6 0 0 1 0 8" fill="none" stroke="#00996c" stroke-width="1.6" stroke-linecap="round"/><circle class="nv-halo" cx="4.1" cy="12" r="2" fill="none" stroke="#00996c" stroke-width="1.4"/><circle cx="4.1" cy="12" r="2" fill="none" stroke="#00996c" stroke-width="1.8"/></g></svg>
