<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="empentIA pilar · IA a medida"><style>
  .nv-halo,.sonar,.fl,.bar{transform-box:fill-box;transform-origin:center}
  .nv-halo{animation:halo 2.4s infinite ease-out}
  @keyframes halo{0%{transform:scale(.7);opacity:.75}80%,100%{transform:scale(2.3);opacity:0}}
  .sonar{animation:sonar 2s infinite ease-out}.sonar.s2{animation-delay:.6s}
  @keyframes sonar{0%{transform:scale(.5);opacity:.85}100%{transform:scale(1.3);opacity:0}}
  .ln{stroke-dasharray:13;animation:draw 2.4s infinite}.ln.l2{animation-delay:.3s}.ln.l3{animation-delay:.6s}
  @keyframes draw{0%{stroke-dashoffset:13;opacity:.3}30%{stroke-dashoffset:0;opacity:1}80%{opacity:1}100%{stroke-dashoffset:0;opacity:.3}}
  .fl{animation:flow 1.8s infinite}.fl.f2{animation-delay:.3s}.fl.f3{animation-delay:.6s}
  @keyframes flow{0%,100%{opacity:.2;transform:scale(.55)}45%{opacity:1;transform:scale(1)}}
  .bar{transform-origin:bottom;animation:grow 2.2s infinite ease-in-out}
  .bar.b2{animation-delay:.18s}.bar.b3{animation-delay:.36s}.bar.b4{animation-delay:.54s}
  @keyframes grow{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
  .bl{animation:blink 1.8s infinite}.bl.k2{animation-delay:.45s}.bl.k3{animation-delay:.9s}
  @keyframes blink{0%,100%{opacity:.32}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.ln{stroke-dashoffset:0}.bar{transform:scaleY(1)}.fl,.sonar{opacity:.6}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C088"/><stop offset="1" stop-color="#00D99E"/></linearGradient></defs><rect x="0" y="0" width="96" height="96" rx="22" fill="url(#bg)"/><g transform="translate(48,48) scale(2.3) translate(-12,-12)"><rect x="6" y="6" width="12" height="12" rx="2.4" fill="none" stroke="#FAFAF7" stroke-width="1.9"/><line class="bl" x1="9" y1="3.4" x2="9" y2="6" stroke="#FAFAF7" stroke-width="1.7" stroke-linecap="round"/><line class="bl k2" x1="15" y1="3.4" x2="15" y2="6" stroke="#FAFAF7" stroke-width="1.7" stroke-linecap="round"/><line class="bl k3" x1="9" y1="18" x2="9" y2="20.6" stroke="#FAFAF7" stroke-width="1.7" stroke-linecap="round"/><line class="bl k2" x1="15" y1="18" x2="15" y2="20.6" stroke="#FAFAF7" stroke-width="1.7" stroke-linecap="round"/><line class="bl k3" x1="3.4" y1="9" x2="6" y2="9" stroke="#FAFAF7" stroke-width="1.7" stroke-linecap="round"/><line class="bl" x1="3.4" y1="15" x2="6" y2="15" stroke="#FAFAF7" stroke-width="1.7" stroke-linecap="round"/><line class="bl k2" x1="18" y1="9" x2="20.6" y2="9" stroke="#FAFAF7" stroke-width="1.7" stroke-linecap="round"/><line class="bl k3" x1="18" y1="15" x2="20.6" y2="15" stroke="#FAFAF7" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12 15.4 8.6" fill="none" stroke="#FAFAF7" stroke-width="1.4" stroke-linecap="round"/><circle class="nv-halo" cx="12" cy="12" r="2" fill="none" stroke="#FAFAF7" stroke-width="1.4"/><circle cx="12" cy="12" r="2" fill="none" stroke="#FAFAF7" stroke-width="1.8"/></g></svg>
