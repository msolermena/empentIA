<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 28 28" width="48" height="48" role="img" aria-label="empentIA · Agente Reseñas">
<style>
  .ic-halo,.ic-sonar,.ic-snode,.ic-star,.ic-spark{transform-box:fill-box;transform-origin:center}
  .ic-halo{animation:halo 2.4s infinite ease-out}
  @keyframes halo{0%{transform:scale(.7);opacity:.7}80%,100%{transform:scale(2.3);opacity:0}}
  .td{animation:tdot 1.4s infinite}.td.d2{animation-delay:.2s}.td.d3{animation-delay:.4s}
  @keyframes tdot{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .ic-scan{transform-box:fill-box;animation:scanx 2.1s infinite ease-in-out}
  @keyframes scanx{0%{transform:translateX(0);opacity:0}18%{opacity:.95}82%{opacity:.95}100%{transform:translateX(9.5px);opacity:0}}
  .ic-tick{stroke-dasharray:14;animation:draw 2s infinite}.ic-tick.t2{animation-delay:.5s}
  @keyframes draw{0%{stroke-dashoffset:14;opacity:.35}35%{stroke-dashoffset:0;opacity:1}75%{opacity:1}100%{stroke-dashoffset:0;opacity:.35}}
  .ic-sonar{animation:sonar 1.9s infinite ease-out}
  @keyframes sonar{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.25);opacity:0}}
  .ic-snode{animation:snp 1.7s infinite}.ic-snode.s2{animation-delay:.28s}.ic-snode.s3{animation-delay:.56s}
  @keyframes snp{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
  .ic-star{animation:twk 2.6s infinite ease-in-out}
  @keyframes twk{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .ic-spark{animation:spk 2.6s infinite}.ic-spark.s2{animation-delay:.55s}.ic-spark.s3{animation-delay:1.1s}
  @keyframes spk{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.ic-tick{stroke-dashoffset:0}.ic-scan,.ic-spark{opacity:0}}
</style>
<path class="ic-star" d="M12 3.7l2.5 5.2 5.7.5-4.35 3.75 1.32 5.65L12 16.05 6.43 18.8l1.32-5.65L3.4 9.4l5.7-.5z" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linejoin="round"/><path class="ic-spark s1" d="M19.2 4.2v2.6 M17.9 5.5h2.6" stroke="#00d99e" stroke-width="1.4" stroke-linecap="round"/><path class="ic-spark s2" d="M4.6 8.8v2.2 M3.5 9.9h2.2" stroke="#00d99e" stroke-width="1.3" stroke-linecap="round"/><path class="ic-spark s3" d="M19.8 16.2v2 M18.8 17.2h2" stroke="#00d99e" stroke-width="1.2" stroke-linecap="round"/>
</svg>
