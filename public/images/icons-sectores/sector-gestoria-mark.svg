<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="empentIA sector · Gestorías y asesorías"><style>
  .nv-halo,.fl{transform-box:fill-box;transform-origin:center}
