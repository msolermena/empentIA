  @keyframes draw{0%{stroke-dashoffset:13;opacity:.3}30%{stroke-dashoffset:0;opacity:1}80%{opacity:1}100%{stroke-dashoffset:0;opacity:.3}}
  .bl{animation:blink 1.8s infinite}.bl.k2{animation-delay:.45s}.bl.k3{animation-delay:.9s}
  @keyframes blink{0%,100%{opacity:.32}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.ln{stroke-dashoffset:0}}
